name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 1d98c19bf4558d998ef8af32b2ac54f604899c20
          path: protocol-fixtures
      - run: mv protocol-fixtures ../agent-hooks-protocol
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[http,pydantic]" build trio mypy ruff==0.12.12
      - run: python -m build
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: mypy
      - run: PYTHONPATH=src python tests/typecheck_named_boundary_codecs.py
      - run: python ../agent-hooks-protocol/tools/generate_sdk.py --python-sdk . --check
