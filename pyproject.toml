[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthooksprotocol"
version = "0.3.0"
description = "Official non-normative Python SDK for the Agent Hooks Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23,<5", "anyio>=4.8,<5", "sniffio>=1.3,<2"]
license = { file = "LICENSE" }
authors = [{ name = "Agent Hooks Protocol maintainers" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenthooksprotocol = ["py.typed", "schemas.json", "ahp-codegen.lock.json"]

[project.optional-dependencies]
http = ["httpx>=0.28,<1"]
pydantic = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["build>=1.2", "httpx>=0.28,<1", "trio>=0.29,<1", "mypy>=1.15,<2", "ruff==0.12.12", "pydantic>=2.10,<3"]

[tool.mypy]
python_version = "3.11"
files = ["examples", "src/agenthooksprotocol/codec.py", "src/agenthooksprotocol/integrations"]
follow_imports = "silent"
check_untyped_defs = true
strict = true
