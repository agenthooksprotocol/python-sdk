name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 6efb34f8a3da9c174d69edc8e41a62e1ee60ee71
          path: protocol-fixtures
      - run: mv protocol-fixtures ../agent-hooks-protocol
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e . build
      - run: python -m build
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests
