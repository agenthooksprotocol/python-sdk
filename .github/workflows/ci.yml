name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 1d98c19bf4558d998ef8af32b2ac54f604899c20
          path: protocol-fixtures
      - run: mv protocol-fixtures ../agent-hooks-protocol
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras python -m build
      - run: uv run --locked --all-extras python -m compileall -q src tests
      - run: PYTHONPATH=src uv run --locked --all-extras python -m unittest discover -s tests
      - run: uv run --locked --all-extras mypy
      - run: uv run --locked --all-extras mypy --strict src/agenthooksprotocol/oauth.py src/agenthooksprotocol/_oauth_discovery.py src/agenthooksprotocol/_oauth_types.py
      - run: PYTHONPATH=src uv run --locked --all-extras python tests/typecheck_named_boundary_codecs.py
      - run: uv run --locked --all-extras python ../agent-hooks-protocol/tools/generate_sdk.py --python-sdk . --check
