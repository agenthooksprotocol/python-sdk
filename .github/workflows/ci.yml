name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 472c16e97cfd456d98cefa0c2a3d23df2f57dbcf
          path: protocol-fixtures
      - run: mv protocol-fixtures ../agent-hooks-protocol
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[http,pydantic]" build trio mypy ruff==0.12.12
      - run: python -m build
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: mypy
      - run: python ../agent-hooks-protocol/tools/generate_sdk.py --python-sdk . --check
